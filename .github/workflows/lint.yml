name: Lint
on:
  push:
    branches: [main]
  pull_request:
    types: [review_requested]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: true
          require-lockfile: true

      - run: pnpm run lint
